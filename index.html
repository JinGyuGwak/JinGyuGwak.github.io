<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>クァク・ジンギュ — Backend Engineer</title>
    <meta name="description" content="バックエンドエンジニアのポートフォリオ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="#hero" class="logo" data-logo></a>
        <nav class="nav">
          <a href="#tech">Tech Stack</a>
          <a href="#career">経歴</a>
          <a href="#projects">プロジェクト</a>
          <a href="#blog">ブログ記事</a>
          <a href="#contact">お問い合わせ</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- Hero -->
      <section id="hero" class="hero">
        <div class="hero-avatar" data-hero-avatar></div>
        <p class="hero-eyebrow" data-hero-eyebrow></p>
        <h1 class="hero-name" data-hero-name></h1>
        <p class="hero-role" data-hero-role></p>
        <p class="hero-intro" data-hero-intro></p>
        <div class="hero-cta" data-hero-cta></div>
        <!-- <div class="availability" data-availability hidden>
          <span class="dot"></span>
          <span data-availability-text></span>
        </div> -->
      </section>

      <!-- Tech Stack -->
      <section id="tech" class="tech">
        <div class="container">
          <h2 class="section-heading" data-tech-heading></h2>
          <div class="tech-groups" data-tech-groups></div>
        </div>
      </section>

      <!-- Career -->
      <section id="career" class="career">
        <div class="container">
          <h2 class="section-heading">経歴</h2>
          <div class="timeline" data-timeline></div>
        </div>
      </section>

      <!-- Projects -->
      <section id="projects" class="projects">
        <div class="container">
          <h2 class="section-heading">プロジェクト</h2>
          <p class="projects-hint">
            タイトルをクリックすると詳細が表示されます
          </p>
          <div class="project-grid" data-project-grid></div>
        </div>
      </section>

      <!-- Blog -->
      <section id="blog" class="blog">
        <div class="container">
          <h2 class="section-heading">ブログ記事</h2>
          <div class="blog-list" data-blog-list></div>
        </div>
      </section>

      <!-- Contact -->
      <section id="contact" class="contact">
        <div class="container">
          <h2 class="contact-heading" data-contact-heading></h2>
          <p class="contact-body" data-contact-body></p>
          <div class="contact-links" data-contact-links></div>
          <p class="copyright" data-copyright></p>
        </div>
      </section>
    </main>

    <!-- Project detail modal -->
    <div class="modal-overlay" data-modal-overlay hidden>
      <div
        class="modal"
        data-modal
        role="dialog"
        aria-modal="true"
        aria-label="プロジェクト詳細"
      >
        <button class="modal-close" data-modal-close aria-label="閉じる">
          ×
        </button>
        <p class="modal-period" data-modal-period></p>
        <h3 class="modal-title" data-modal-title></h3>

        <p class="modal-label">概要</p>
        <p class="modal-text" data-modal-overview></p>

        <p class="modal-label">担当・役割</p>
        <p class="modal-text" data-modal-role></p>

        <p class="modal-label">使用技術</p>
        <div class="stack" data-modal-stack></div>

        <p class="modal-label">取り組み・成果</p>
        <ul class="modal-highlights" data-modal-highlights></ul>
      </div>
    </div>

    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
